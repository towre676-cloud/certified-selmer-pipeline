name: Receipt facts and trust-boundary tests (not Selmer certification)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  receipt-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Test rejection of unsupported arithmetic and malformed evidence
        run: python3 -m unittest discover -s tests -v
      - name: Verify existing digest without rewriting receipts
        run: python3 python/verify_receipts.py
      - name: Reproduce explicitly limited receipt facts
        run: |
          python3 python/parse_certificate.py --scope receipt
          git diff --exit-code -- receipts.json receipts/ lean/CertifiedSelmer/Proofs/
      - name: Kernel replay and transitive axiom audit
        run: python3 python/audit_lean.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-facts-audit-NOT-Selmer-certification
          path: audit/
